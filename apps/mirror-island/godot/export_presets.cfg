[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="generated/*.json,generated/*.txt,data/*.json,persistence/browser_save.js"
exclude_filter="addons/*,tools/*,engine-lock.json,AGENTS.md"
export_path="exports/web/index.html"

[preset.0.options]
custom_template/debug="../../../artifacts/godot-runtime/templates/web_nothreads_debug.zip"
custom_template/release="../../../artifacts/godot-runtime/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="generated/*.json,generated/*.txt,data/*.json,persistence/browser_save.js"
exclude_filter="addons/*,tools/*,engine-lock.json,AGENTS.md"
export_path="exports/windows/mirror-island.exe"

[preset.1.options]
custom_template/debug="../../../artifacts/godot-runtime/templates/windows_debug_x86_64.exe"
custom_template/release="../../../artifacts/godot-runtime/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=false
