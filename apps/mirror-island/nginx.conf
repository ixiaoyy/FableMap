server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location /game-media/v1/ {
        proxy_pass https://img.pingxingxian.space/game/media/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host img.pingxingxian.space;
        proxy_ssl_server_name on;
        proxy_ssl_name img.pingxingxian.space;
    }

    location = /identity {
        return 308 /identity/;
    }

    location /identity/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /forum-sso/ {
        proxy_pass http://mirror-game:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /api/v1/auth/parallellines/callback {
        proxy_pass http://mirror-game:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location = /mirror-island {
        return 308 /;
    }

    location /mirror-island/ {
        return 308 /;
    }

    location /assets/ {
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types application/javascript text/javascript text/css application/json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /map/ {
        types { application/json tmj; }
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types application/json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
