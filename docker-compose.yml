x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  frontend:
    build:
      context: .
      dockerfile: apps/mirror-island/Dockerfile.web
      args:
        VITE_MIRROR_BASE_PATH: /
    image: fablespace-frontend:local
    ports:
      - "${FABLESPACE_WEB_BIND:-3000}:80"
    logging: *default-logging
